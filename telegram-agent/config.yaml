# ============================================================
#  סוכן דירות — קונפיגורציה
#  העתיקי לקובץ בשם config.yaml וערכי שם. הקובץ הזה הוא התבנית.
# ============================================================

telegram:
  # אל תשימי כאן טוקן אמיתי אם הקובץ נכנס לגיט.
  # עדיף להגדיר משתני סביבה TELEGRAM_TOKEN ו-TELEGRAM_CHAT_ID —
  # הם תמיד גוברים על מה שכתוב כאן.
  token: ""
  chat_id: ""

interval_minutes: 20   # כל כמה זמן לסרוק במצב bot
max_per_run: 12        # תקרת הודעות לסריקה, כדי לא להציף אותך
state_path: state/seen.json

criteria:
  min_rooms: 1.5
  max_rooms: 3.0
  max_price: 4000      # ברירת מחדל; אזור יכול לדרוס אותה

  areas:
    moshavim:
      priority: 10
      max_price: 4000
      cities: [נטעים, בית עובד, בית חנן, כפר הנגיד, פלמחים, גן שורק, צפריה, עיינות]

    rishon:
      priority: 5
      min_price: 3500  # בראשל"צ מתחת ל-3,500 זה כמעט תמיד חדר, לא דירה
      max_price: 4000
      cities: [ראשון לציון]

    nes_ziona:
      priority: 5
      max_price: 4000
      cities: [נס ציונה, רחובות, גבעת ברנר, קרית עקרון]

  # גינה ומרפסת מעלות ציון אבל לא מפסילות — מודעות רבות
  # פשוט לא מציינות אותן בטקסט, וחבל לפספס בגללן.
  require_outdoor: false

  # אם המודעה אומרת במפורש "ללא בעלי חיים" — לדלג
  reject_explicit_no_pets: true

  exclude_keywords: [שותפים, שותפה, סאבלט, לתקופה קצרה, נופש, מחסן]

  min_score: 0         # העלי ל-60 אם מגיעות יותר מדי התראות

sources:
  # ----------------------------------------------------------
  # הומלס — המקור הכי אמין. HTML רגיל, בלי דפדפן, בלי חסימות.
  # ----------------------------------------------------------
  homeless:
    enabled: true
    delay_seconds: 2
    known_cities:
      [נטעים, בית עובד, בית חנן, כפר הנגיד, פלמחים, ראשון לציון,
       נס ציונה, רחובות, גבעת ברנר, קרית עקרון, גן שורק, צפריה,
       עיינות, בית אלעזרי, אחיסמך, ינון, נחלים]
    cities: [נטעים, בית עובד, בית חנן, כפר הנגיד, קיבוץ פלמחים]
    area_ids:
      - 10    # מושבים במרכז
      - 168   # ראשון לציון

  # ----------------------------------------------------------
  # יד2 — דורש דפדפן (playwright). לפעמים חוסם; אם זה קורה,
  # הגדילי את interval_minutes או כבי אותו זמנית.
  # קודי היישוב: פלמחים 0597, נטעים 0174, בית עובד 0202,
  #              בית חנן 0159, כפר הנגיד 0582,
  #              ראשל"צ 8300, נס ציונה 7200
  # ----------------------------------------------------------
  yad2:
    enabled: true
    headless: true
    delay_seconds: 4
    known_cities:
      [נטעים, בית עובד, בית חנן, כפר הנגיד, פלמחים, ראשון לציון, נס ציונה]
    urls:
      - "https://www.yad2.co.il/realestate/rent?topArea=2&area=9&city=0597,0174,0202,0159,0582&minRooms=1.5&maxRooms=3&maxPrice=4000"
      - "https://www.yad2.co.il/realestate/rent?topArea=2&area=9&city=8300&minRooms=2&maxRooms=3&minPrice=3500&maxPrice=4000&property=3,11"
      - "https://www.yad2.co.il/realestate/rent?topArea=41&area=12&city=7200&minRooms=2&maxRooms=3&maxPrice=4000"

  # ----------------------------------------------------------
  # פייסבוק — כבוי בכוונה. קראי את האזהרות ב-README לפני שמפעילים,
  # והריצי קודם: python -m dira login-facebook
  # ----------------------------------------------------------
  facebook:
    enabled: false
    headless: true
    scrolls: 4
    delay_seconds: 15
    known_cities:
      [נטעים, בית עובד, בית חנן, כפר הנגיד, פלמחים, ראשון לציון, נס ציונה]
    groups:
      - dirotbemoshavimdarom      # דירות במושבים — דרום
      - "1414853725269536"        # דירות/בתים להשכרה במושבים בשפלה
      - "1472569969685762"        # דירות בשושו — ראשל"צ, נס ציונה, רחובות

  # מקור בדיקה. הפעילי אותו לרגע כדי לוודא שההתראות מגיעות.
  demo:
    enabled: false
